<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Used as an <img> and as the favicon, so it cannot read the page's CSS variables:
       the colours repeat the accent and accent-contrast tokens from css/styles.css.
       (XML forbids a double hyphen inside a comment, so the token names are spelled out.) -->
  <style>
    .pick { fill: #c2410c; }
    .move { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .pick { fill: #fb923c; }
      .move { stroke: #1b1107; }
      .dot { fill: #1b1107; }
    }
  </style>
