<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy Changes</title>
  <meta name="description" content="Look up any guitar chord and see every way to play it, including inversions and slash chords, sorted from easiest to hardest.">
  <!-- Link previews (chat apps, social sites) need absolute URLs and a PNG, not SVG. -->
  <meta property="og:site_name" content="Easy Changes">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Easy Changes: guitar chords made easy">
  <meta property="og:description" content="Look up any guitar chord and see every way to play it, including inversions and slash chords, sorted from easiest to hardest.">
  <meta property="og:url" content="https://bartoszbielawski.github.io/easy-changes/">
  <meta property="og:image" content="https://bartoszbielawski.github.io/easy-changes/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="An orange guitar pick with an arrow, next to the words Easy Changes">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preload" href="data/chord-types.json" as="fetch" crossorigin>
  <link rel="preload" href="data/guitar-voicings.json" as="fetch" crossorigin>
  <script>
    // If this browser can't run the page's modules (older than 2021), or a data file
    // fails to download, the modules fail silently and the page stays empty. Their
    // errors still reach window, so show a message instead. Plain ES5 on purpose.
    window.showUnsupported = function () {
      var note = document.getElementById('unsupported');
      if (window.easyChangesReady || !note) return;
      document.documentElement.className += ' unsupported';
      note.hidden = false;
    };
    window.addEventListener('error', window.showUnsupported);
  </script>
  <noscript><style>main > :not(noscript), footer { display: none !important; }</style></noscript>
</head>
<body>
  <header>
    <h1><img class="logo" src="img/logo.svg" alt="">Easy Changes</h1>
    <nav><a href="index.html" aria-current="page">Chords</a><a href="progression.html">Progression</a></nav>
  </header>

  <main>
    <noscript><p class="notice">Easy Changes works out chords and voicings in your browser, so it needs JavaScript. Turn JavaScript on for this site and reload the page.</p></noscript>
    <p class="notice" id="unsupported" hidden>Easy Changes couldn't start in this browser. It needs a browser from 2021 or later: a current Chrome, Edge, Firefox or Safari will work.</p>
    <form id="search" class="entry" autocomplete="off">
      <label class="field wide">
        <span>Chord</span>
        <input id="symbol" name="symbol" placeholder="e.g. F#m7, Bbmaj7, G7/B" spellcheck="false">
      </label>
    </form>

    <section class="pickers">
      <div class="picker-row"><span class="row-label">Root</span><div class="picker" id="roots" role="group" aria-label="Root"></div></div>
      <div class="picker-row"><span class="row-label">Type</span><div class="picker types" id="types" role="group" aria-label="Chord type"></div></div>
      <div class="picker-row"><span class="row-label">Bass</span><div class="picker" id="bass" role="group" aria-label="Bass note"></div></div>
    </section>

    <section id="chord-info" aria-live="polite"></section>
    <section id="voicings" class="voicing-grid"></section>
  </main>

  <footer>
    <div id="legend"></div>
    <p id="stats"></p>
  </footer>
  <script type="module" src="js/app.js"></script>
  <script nomodule>window.showUnsupported();</script>
</body>
</html>
